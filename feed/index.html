<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>corto</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://dbvzgdcfzdmetscgsrpv.supabase.co; media-src https://dbvzgdcfzdmetscgsrpv.supabase.co; connect-src https://dbvzgdcfzdmetscgsrpv.supabase.co; font-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="feed.css?v=20261121-4">
</head>
<body>

<header class="topbar" id="cabecera" hidden>
  <div class="logo">corto<span>.</span></div>
</header>

<div class="nav" id="nav" aria-label="Navegar entre videos" hidden>
  <button type="button" id="nav-siguiente" aria-label="Video siguiente" disabled>
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>

<!-- Pantalla de acceso: lo único visible sin un pase válido -->
<section class="acceso" id="acceso" hidden>
  <form class="acceso-tarjeta" id="form-acceso" novalidate>
    <div class="logo acceso-logo">corto<span>.</span></div>
    <label for="codigo-acceso">Código de acceso</label>
    <input id="codigo-acceso" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
           maxlength="24" placeholder="0000 0000" spellcheck="false" autocapitalize="off" required>
    <p class="acceso-aviso" id="acceso-aviso" role="status" hidden></p>
    <p class="acceso-error" id="acceso-error" role="alert" hidden></p>
    <button type="submit" id="acceso-enviar">Entrar</button>
  </form>
</section>

<!-- Registro: aviso de privacidad y datos del participante (después del código, antes del feed) -->
<section class="registro" id="registro" hidden>
  <div class="registro-tarjeta">
    <div class="logo registro-logo">corto<span>.</span></div>
    <div class="registro-pestanas" role="tablist" aria-label="Registro">
      <button type="button" role="tab" id="tab-aviso" aria-controls="panel-aviso" aria-selected="true">Aviso de privacidad</button>
      <button type="button" role="tab" id="tab-datos" aria-controls="panel-datos" aria-selected="false" tabindex="-1">Tus datos</button>
    </div>
    <div class="registro-panel registro-aviso" id="panel-aviso" role="tabpanel" aria-labelledby="tab-aviso" tabindex="0"></div>
    <form class="registro-panel registro-datos" id="panel-datos" role="tabpanel" aria-labelledby="tab-datos" novalidate hidden>
      <div class="campo">
        <label for="reg-matricula">Matrícula</label>
        <input id="reg-matricula" name="matricula" type="text" maxlength="15" autocomplete="off"
               autocapitalize="characters" spellcheck="false" aria-describedby="reg-matricula-error" required>
        <div class="campo-pie">
          <p class="campo-error" id="reg-matricula-error" hidden></p>
          <span class="campo-contador" id="reg-matricula-contador" aria-hidden="true">0/15</span>
        </div>
      </div>
      <div class="campo">
        <label for="reg-nombre">Nombre</label>
        <p class="campo-ayuda" id="reg-nombre-ayuda">Solo tu nombre de pila, sin apellidos</p>
        <input id="reg-nombre" name="nombre" type="text" maxlength="40" autocomplete="off"
               autocapitalize="words" spellcheck="false" aria-describedby="reg-nombre-ayuda reg-nombre-error" required>
        <div class="campo-pie">
          <p class="campo-error" id="reg-nombre-error" hidden></p>
          <span class="campo-contador" id="reg-nombre-contador" aria-hidden="true">0/40</span>
        </div>
      </div>
      <div class="campo">
        <label for="reg-carrera">Carrera</label>
        <input id="reg-carrera" name="carrera" type="text" maxlength="60" autocomplete="off"
               spellcheck="false" aria-describedby="reg-carrera-error" required>
        <div class="campo-pie">
          <p class="campo-error" id="reg-carrera-error" hidden></p>
          <span class="campo-contador" id="reg-carrera-contador" aria-hidden="true">0/60</span>
        </div>
      </div>
      <div class="campos-fila">
        <div class="campo">
          <label for="reg-edad">Edad</label>
          <p class="campo-ayuda" id="reg-edad-ayuda">De 17 a 99 años</p>
          <input id="reg-edad" name="edad" type="text" inputmode="numeric" maxlength="2" autocomplete="off"
                 spellcheck="false" aria-describedby="reg-edad-ayuda reg-edad-error" required>
          <div class="campo-pie">
            <p class="campo-error" id="reg-edad-error" hidden></p>
          </div>
        </div>
        <div class="campo">
          <label for="reg-semestre">Semestre</label>
          <p class="campo-ayuda" id="reg-semestre-ayuda">Del 1 al 14</p>
          <input id="reg-semestre" name="semestre" type="text" inputmode="numeric" maxlength="2" autocomplete="off"
                 spellcheck="false" aria-describedby="reg-semestre-ayuda reg-semestre-error" required>
          <div class="campo-pie">
            <p class="campo-error" id="reg-semestre-error" hidden></p>
          </div>
        </div>
      </div>
    </form>
    <div class="registro-pie">
      <label class="registro-casilla">
        <input type="checkbox" id="reg-acepto" required aria-required="true">
        <span>He leído el aviso de privacidad y acepto participar en este estudio</span>
      </label>
      <p class="registro-error" id="reg-error" role="alert" hidden></p>
      <button type="button" class="registro-boton" id="reg-enviar" disabled>Estoy de acuerdo</button>
    </div>
  </div>
</section>

<!-- Instrucción antes de la fase a ciegas -->
<section class="pantalla" id="instruccion" aria-labelledby="instruccion-texto" hidden>
  <div class="pantalla-tarjeta">
    <div class="logo pantalla-logo">corto<span>.</span></div>
    <p class="pantalla-texto" id="instruccion-texto">Navega como lo harías normalmente en tus redes. Puedes pasar cualquier video que no te interese.</p>
    <p class="pantalla-error" id="instruccion-error" role="alert" hidden></p>
    <button type="button" class="pantalla-boton" id="instruccion-comenzar" aria-label="Comenzar">Comenzar</button>
  </div>
</section>

<!-- Pantalla provisional al terminar la fase a ciegas (se reemplaza en la siguiente entrega) -->
<section class="pantalla" id="fin-ciega" aria-labelledby="fin-ciega-texto" hidden>
  <div class="pantalla-tarjeta">
    <div class="logo pantalla-logo">corto<span>.</span></div>
    <p class="pantalla-texto" id="fin-ciega-texto" tabindex="-1">Fin de la fase a ciegas.</p>
  </div>
</section>

<main class="feed" id="feed" hidden>
  <p class="estado-feed" id="feed-estado" role="status">Cargando videos…</p>
</main>
<div class="feed-espera" id="feed-espera" role="status" aria-label="Cargando el siguiente video" hidden><span class="giro"></span></div>

<template id="tpl-slide">
  <section class="slide">
    <article class="player">
      <div class="media">
        <video playsinline muted loop preload="none"
               disablepictureinpicture disableremoteplayback
               controlslist="nodownload noplaybackrate noremoteplayback nofullscreen"
               tabindex="-1" aria-hidden="true"></video>
        <p class="aviso" data-aviso hidden></p>
      </div>
      <div class="escudo" data-escudo aria-hidden="true"></div>
      <div class="player-top">
        <button class="icon-chip" type="button" data-pausa aria-label="Pausar">
          <svg viewBox="0 0 24 24" data-icono-pausa><path d="M9 5v14M15 5v14"/></svg>
          <svg viewBox="0 0 24 24" data-icono-play hidden><path d="M7 5l12 7-12 7z"/></svg>
        </button>
        <button class="icon-chip" type="button" data-sonido aria-label="Activar sonido">
          <svg viewBox="0 0 24 24" data-icono-mudo><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
          <svg viewBox="0 0 24 24" data-icono-sonido hidden><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </button>
      </div>
      <div class="overlay">
        <div class="author">
          <div class="avatar"><img data-avatar alt="" hidden></div>
          <span class="username" data-usuario></span>
          <button class="follow" type="button" data-seguir aria-pressed="false">Seguir</button>
        </div>
        <p class="caption" data-descripcion></p>
        <button type="button" class="barra-enlace" data-enlace hidden>
          <span data-enlace-texto></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <p class="sound" data-sonido-texto><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span data-sonido-nombre></span></p>
      </div>
      <div class="progress"><span data-progreso></span></div>
    </article>
    <aside class="actions" aria-label="Interacciones">
      <button class="action" type="button" data-me-gusta aria-label="Me gusta" aria-pressed="false"><span class="circle"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></span><span class="cuenta" data-cuenta aria-hidden="true"></span></button>
      <button class="action" type="button" data-comentarios aria-label="Comentarios" aria-expanded="false"><span class="circle"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg></span><span class="cuenta" data-cuenta aria-hidden="true"></span></button>
      <button class="action" type="button" data-guardar aria-label="Guardar" aria-pressed="false"><span class="circle"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span><span class="cuenta" data-cuenta aria-hidden="true"></span></button>
      <button class="action" type="button" data-compartir aria-label="Compartir"><span class="circle"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></span></button>
      <button class="action" type="button" data-mas aria-label="Más opciones" aria-haspopup="menu" aria-expanded="false"><span class="circle"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span></button>
      <div class="disc" aria-hidden="true"><img data-portada alt="" hidden></div>
    </aside>
  </section>
</template>

<!-- Panel de comentarios (solo lectura): hoja inferior dentro de la tarjeta, con el video visible arriba -->
<template id="tpl-comentarios">
  <div class="capa capa-comentarios" data-capa>
    <div class="capa-fondo" data-fondo></div>
    <section class="hoja hoja-comentarios" role="dialog" aria-modal="false" aria-label="Comentarios del video" data-hoja>
      <header class="hoja-cabecera">
        <h2 class="hoja-titulo" data-titulo></h2>
        <button type="button" class="hoja-cerrar" data-cerrar aria-label="Cerrar comentarios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <ul class="lista-comentarios" data-lista tabindex="0" aria-label="Lista de comentarios"></ul>
      <p class="comentarios-vacio" data-vacio hidden>Todavía no hay comentarios.</p>
      <div class="comentar-barra">
        <span class="comentar-avatar" aria-hidden="true"></span>
        <input class="comentar-campo" type="text" disabled placeholder="Agregar comentario…" aria-label="Agregar comentario (no disponible)">
      </div>
    </section>
  </div>
</template>

<template id="tpl-comentario">
  <li class="comentario">
    <div class="avatar-com" data-avatar-com aria-hidden="true"></div>
    <div class="comentario-cuerpo">
      <p class="comentario-usuario" data-com-usuario></p>
      <p class="comentario-texto" data-com-texto></p>
      <p class="comentario-meta"><time data-com-fecha></time><span class="comentario-responder">Responder</span></p>
    </div>
    <div class="comentario-me-gusta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.1C1.5 8.3 3.4 4.8 6.9 4.5c2-.2 3.8.9 5.1 2.6 1.3-1.7 3.1-2.8 5.1-2.6 3.5.3 5.4 3.8 4.2 6.9-1.8 4.5-9.3 9.1-9.3 9.1z"/></svg>
      <span data-com-me-gusta></span>
    </div>
  </li>
</template>

<!-- Ventanas simuladas: contenido propio, genérico e inerte (sin enlaces, campos ni recursos externos) -->
<template id="tpl-compartir">
  <div class="capa capa-simulada" data-capa>
    <div class="capa-fondo"></div>
    <section class="hoja hoja-compartir" role="dialog" aria-modal="false" aria-label="Compartir" data-hoja>
      <header class="hoja-cabecera">
        <h2 class="hoja-titulo">Compartir</h2>
        <button type="button" class="hoja-cerrar" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div class="carga" data-carga role="status" aria-label="Cargando"><span class="giro"></span></div>
      <div class="simulada-contenido" data-contenido inert hidden>
        <ul class="opciones-compartir">
          <li><span class="opcion-circulo"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg></span>Mensaje</li>
          <li><span class="opcion-circulo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>Correo</li>
          <li><span class="opcion-circulo"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>Copiar enlace</li>
          <li><span class="opcion-circulo"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></span>Insertar</li>
          <li><span class="opcion-circulo"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2"/></svg></span>Código QR</li>
          <li><span class="opcion-circulo"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>Más</li>
        </ul>
      </div>
    </section>
  </div>
</template>

<template id="tpl-ventana-enlace">
  <div class="capa capa-simulada" data-capa>
    <div class="capa-fondo"></div>
    <section class="ventana-enlace" role="dialog" aria-modal="false" data-hoja>
      <header class="ventana-barra">
        <button type="button" class="hoja-cerrar" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <p class="ventana-titulo" data-ventana-titulo></p>
      </header>
      <div class="carga" data-carga role="status" aria-label="Cargando"><span class="giro"></span></div>
      <div class="simulada-contenido ventana-pagina" data-contenido inert hidden aria-hidden="true">
        <div class="pagina-imagen"></div>
        <div class="pagina-titulo"></div>
        <div class="pagina-linea"></div>
        <div class="pagina-linea"></div>
        <div class="pagina-linea"></div>
        <div class="pagina-linea corta"></div>
        <div class="pagina-linea"></div>
        <div class="pagina-linea corta"></div>
      </div>
    </section>
  </div>
</template>

<template id="tpl-menu-mas">
  <div class="menu-mas" role="menu" aria-label="Más opciones" data-menu>
    <button type="button" role="menuitem">Copiar enlace</button>
    <button type="button" role="menuitem">No me interesa</button>
    <button type="button" role="menuitem">Reportar</button>
  </div>
</template>

<script src="../admin/config.js?v=20261120-1"></script>
<script src="aviso-privacidad.js?v=20261121-1"></script>
<script src="feed.js?v=20261121-4"></script>
</body>
</html>
