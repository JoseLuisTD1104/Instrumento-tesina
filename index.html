<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>corto</title>
<style>
  :root { --bg: #0f1013; --surface: #1c1d22; --text: #f2f2f4; --dim: #a6a7ad; --accent: #ff3b5c; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; }
  .logo { font-weight: 800; font-size: 40px; letter-spacing: -1px; margin-bottom: 28px; }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-block; min-width: 180px; padding: 14px 20px; border-radius: 10px;
    background: var(--surface); color: var(--text); text-decoration: none; font-weight: 600;
  }
  a.primario { background: var(--accent); color: #fff; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="logo">corto<span>.</span></div>
  <nav>
    <a class="primario" href="feed/">Ver el feed</a>
    <a href="admin/">Panel de administrador</a>
  </nav>
</main>
</body>
</html>
