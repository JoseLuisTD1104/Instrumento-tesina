<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>corto · Panel de administrador</title>
<style>
  :root {
    --bg: #0f1013;
    --surface: #1c1d22;
    --surface-2: #24252b;
    --border: #33343a;
    --text: #f2f2f4;
    --text-dim: #a6a7ad;
    --accent: #ff3b5c;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-width: 768px; /* solo modo escritorio: en pantallas más angostas se desplaza en vez de reacomodarse */
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  /* ---------- Encabezado ---------- */
  .topbar {
    height: 64px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 clamp(24px, 4vw, 48px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .badge { font-size: 13px; color: var(--text-dim); padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; }

  /* ---------- Contenedor ---------- */
  .wrap {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px clamp(24px, 4vw, 48px) 48px;
  }

  /* ---------- Pestañas ---------- */
  .tabs {
    display: flex; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    position: relative;
    padding: 14px 20px;
    min-height: 48px; /* tamaño cómodo también al tocar en tablet */
    font-size: 15px; font-weight: 600;
    color: var(--text-dim);
    border-radius: 8px 8px 0 0;
  }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 3px; border-radius: 2px; background: var(--accent);
  }

  .panel { padding-top: 28px; }
  .panel[hidden] { display: none; }

  /* ---------- Área de arrastrar y soltar ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: clamp(24px, 5vw, 56px);
  }
  .dropzone {
    min-height: clamp(280px, 45vh, 420px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    text-align: center;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover { border-color: #55565d; }
  .dropzone.over { border-color: var(--accent); background: rgba(255, 59, 92, .06); }

  .dropzone svg { width: 120px; height: 84px; margin-bottom: 14px; color: #6b6c73; }
  .dropzone.over svg { color: var(--accent); }

  .dz-title { font-size: clamp(22px, 2.4vw, 28px); font-weight: 700; color: var(--text-dim); line-height: 1.25; }
  .dz-sub { font-size: 15px; color: #7c7d84; }
  .dz-sub strong { color: var(--text); font-weight: 600; }
  .dz-hint { margin-top: 14px; font-size: 13px; color: #6b6c73; }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">corto<span>.</span></div>
  <span class="badge">Panel de administrador</span>
</header>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Secciones del panel">
    <button class="tab" role="tab" id="tab-subir" aria-controls="panel-subir" aria-selected="true">Subir videos</button>
    <button class="tab" role="tab" id="tab-administrar" aria-controls="panel-administrar" aria-selected="false" tabindex="-1">Administrar videos</button>
    <button class="tab" role="tab" id="tab-analiticas" aria-controls="panel-analiticas" aria-selected="false" tabindex="-1">Analíticas</button>
  </div>

  <section class="panel" id="panel-subir" role="tabpanel" aria-labelledby="tab-subir" tabindex="0">
    <div class="card">
      <div class="dropzone" id="dropzone" role="button" tabindex="0"
           aria-label="Área para soltar videos. Haz doble clic o presiona Enter para buscar en tu dispositivo.">
        <svg viewBox="0 0 120 84" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M32 76h58a22 22 0 0 0 3-43.8A30 30 0 0 0 36.5 22 27 27 0 0 0 32 76z"/>
          <circle cx="60" cy="50" r="14"/>
          <path d="M60 58V42M53 48l7-7 7 7"/>
        </svg>
        <p class="dz-title">Arrastra y suelta<br>tus videos aquí</p>
        <p class="dz-sub">o haz <strong>doble clic</strong> para buscarlos en tu dispositivo</p>
        <p class="dz-hint">Solo archivos de video</p>
      </div>
      <input class="visually-hidden" type="file" id="selector" accept="video/*" multiple tabindex="-1" aria-hidden="true">
    </div>
  </section>

  <section class="panel" id="panel-administrar" role="tabpanel" aria-labelledby="tab-administrar" tabindex="0" hidden></section>
  <section class="panel" id="panel-analiticas" role="tabpanel" aria-labelledby="tab-analiticas" tabindex="0" hidden></section>
</main>

<script>
  // ---- Cambio de pestañas (incluye flechas del teclado) ----
  const tabs = [...document.querySelectorAll('[role="tab"]')];

  function activar(tab) {
    tabs.forEach(t => {
      const activa = t === tab;
      t.setAttribute('aria-selected', activa);
      t.tabIndex = activa ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !activa;
    });
    tab.focus();
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => activar(tab));
    tab.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') activar(tabs[(i + 1) % tabs.length]);
      if (e.key === 'ArrowLeft')  activar(tabs[(i - 1 + tabs.length) % tabs.length]);
    });
  });

  // ---- Abrir el explorador de archivos (solo elegir, no sube nada) ----
  const zona = document.getElementById('dropzone');
  const selector = document.getElementById('selector');

  zona.addEventListener('dblclick', () => selector.click());
  zona.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selector.click(); }
  });

  // ---- Evitar que el navegador abra el video al soltarlo y salga del panel ----
  ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('over'); }));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
</script>
</body>
</html>
